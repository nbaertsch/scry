[project]
name = "scry-cli"
version = "0.0.1"
description = "Local-first MCP server for code↔spec drift detection via hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Noah Baertsch" }]
keywords = ["mcp", "rag", "code-search", "drift-detection", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]

dependencies = [
  # Markdown + tree-sitter (extraction)
  "markdown-it-py >=3.0,<4",
  "tree-sitter-language-pack >=0.3,<1",
  # Storage
  "sqlite-vec >=0.1.6,<1",
  # Embeddings (lazy-loaded; not required at install)
  "fastembed >=0.4,<1",
  # MCP server
  "fastmcp >=2.0,<3",
  # HTTP client (LLM provider API calls)
  "httpx >=0.25,<1",
  # Pydantic v2 for models
  "pydantic >=2.6,<3",
  # YAML for config
  "PyYAML >=6.0,<7",
  # CLI
  "click >=8.1,<9",
  # Hashing helpers
  "simhash >=2.1,<3",
]

[project.optional-dependencies]
# pip install "scry-cli[litellm]" — enables LiteLLMProvider for multi-provider routing.
litellm = ["litellm >=1.0,<2"]
windows = ["pywin32 >=306; platform_system == 'Windows'"]
dev = [
  "pytest >=8.0,<9",
  "pytest-cov >=5.0,<6",
  "pytest-asyncio >=0.23,<1",
  "ruff >=0.5,<1",
  "mypy >=1.10,<2",
  "types-PyYAML",
]

[project.scripts]
scry = "scry.cli:main"

[project.urls]
Homepage = "https://github.com/nbaertsch/scry"
Repository = "https://github.com/nbaertsch/scry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scry"]

# ─── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle + pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "C4",           # comprehensions
  "SIM",          # simplifications
  "RUF",          # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts in tests

[tool.ruff.format]
quote-style = "double"

# ─── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
mypy_path = "src"
packages = ["scry"]

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "fastembed.*", "tree_sitter_language_pack.*", "simhash.*", "litellm.*"]
ignore_missing_imports = true

# ─── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-q",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "integration: integration tests requiring filesystem + external tools",
  "windows_only: tests that only run on Windows",
  "unix_only: tests that only run on Linux/macOS",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/scry"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
