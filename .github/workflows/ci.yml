name: CI

on:
  # Gate: only runs on PRs targeting main (not on direct pushes).
  # This drastically reduces minutes for repos that push directly
  # to main — no CI fires until a PR is opened.  Manual dispatch
  # is available for ad-hoc runs.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same PR when a new push arrives,
# so stale matrix jobs don't burn minutes.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: mypy
        run: mypy src

  test:
    needs: lint  # Don't waste matrix minutes if lint fails.
    strategy:
      fail-fast: true  # Kill remaining matrix jobs on first failure.
      matrix:
        # Reduced matrix: Linux + Windows only (macOS 3x cost),
        # Python 3.11 only (3.12 parity is covered by mypy).
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install package + dev deps
        shell: bash
        run: |
          uv pip install --system -e ".[dev]"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            uv pip install --system "pywin32>=306"
          fi
      - name: pytest
        run: pytest --cov=scry --cov-report=term-missing -m "not integration"